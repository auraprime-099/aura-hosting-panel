{% extends "base.html" %}
{% block title %}Log In - AURA Hosting{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-desc">Log in to manage your bots and server instances</p>
        </div>

        <!-- Email & Password Login Form -->
        <form method="POST" action="{{ url_for('login') }}" class="cyber-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="cyber-input" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" class="cyber-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-cyber-primary">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In</span>
            </button>
        </form>

        <p class="auth-footer-text">
            Don't have an account? <a href="{{ url_for('register') }}">Create Account</a>
        </p>
    </div>
</div>
{% endblock %}
