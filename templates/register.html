{% extends "base.html" %}
{% block title %}Register - AURA Hosting{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-desc">Get started with high-performance bot hosting</p>
        </div>

        <!-- Registration Form -->
        <form method="POST" action="{{ url_for('register') }}" class="cyber-form">
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" class="cyber-input" placeholder="johndoe" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="cyber-input" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" class="cyber-input" placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" name="confirm_password" class="cyber-input" placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-cyber-primary">
                <i class="fa-solid fa-user-check"></i>
                <span>Create Account</span>
            </button>
        </form>

        <p class="auth-footer-text">
            Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </p>
    </div>
</div>
{% endblock %}
