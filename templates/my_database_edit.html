{% extends "base.html" %}
{% block content %}
<div class="glass-card edit-card" style="max-width:800px;">
    <div class="header">
        <h2>✏️ Edit Row in {{ table_name }}</h2>
        <div class="user-info">
            <a href="{{ url_for('my_database_table', db_id=db.id, table_name=table_name) }}">← Back to Table</a>
        </div>
    </div>
    <form method="POST">
        {% for col in columns %}
            {% set col_name = col[1] %}
            <div style="margin-bottom:1rem;">
                <label style="display:block; margin-bottom:0.3rem;"><strong>{{ col_name }}</strong></label>
                {% if col_name == pk_column %}
                    <input type="text" name="{{ col_name }}" value="{{ row[col_name] }}" readonly style="width:100%; padding:0.5rem; background:rgba(255,255,255,0.1); border-radius:8px; color:#fff;">
                {% else %}
                    <input type="text" name="{{ col_name }}" value="{{ row[col_name] }}" style="width:100%; padding:0.5rem; background:rgba(255,255,255,0.1); border-radius:8px; color:#fff;">
                {% endif %}
            </div>
        {% endfor %}
        <div class="buttons">
            <button type="submit" class="btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('my_database_table', db_id=db.id, table_name=table_name) }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
