{% extends "base.html" %}
{% block title %}Edit {{ file.orig_name }} - AURA Hosting{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Editing: {{ file.orig_name }}</h1>
        <p class="page-subtitle">File Type: {{ file.file_type|upper }}</p>
    </div>
    <div>
        <a href="{{ url_for('dashboard') }}" class="btn-cyber-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
</div>

<div class="editor-container">
    <div class="editor-header">
        <span style="font-weight: 700; font-size: 0.9rem; color: var(--accent-cyan);">
            <i class="fa-solid fa-code"></i> {{ file.orig_name }}
        </span>
        <span style="font-size: 0.8rem; color: var(--text-dim);">Status: {{ file.status }}</span>
    </div>

    <form method="POST">
        <textarea name="content" class="editor-textarea" spellcheck="false">{{ content }}</textarea>

        <div style="padding: 1rem 1.25rem; background: #161b22; border-top: 1px solid var(--border-subtle); display: flex; gap: 0.75rem; justify-content: flex-end;">
            <a href="{{ url_for('dashboard') }}" class="btn-cyber-secondary">Cancel</a>
            <button type="submit" class="btn-cyber-primary" style="width: auto;">
                <i class="fa-solid fa-floppy-disk"></i> Save File
            </button>
        </div>
    </form>
</div>
{% endblock %}
